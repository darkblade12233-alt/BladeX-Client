
name: BLADEX CLIENT Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          host: windows
          target: desktop
          arch: win64_mingw81
          aqtversion: '==3.2.1'

      - name: Setup MinGW compiler
        uses: egor-tensin/setup-mingw@v2
        with:
          version: 8.1.0
          platform: x64

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          echo "C:\mingw64\bin" >> $env:GITHUB_PATH

      - name: Check compiler versions
        shell: bash
        run: |
          gcc --version
          g++ --version
          cmake --version

      - name: Build and install ZLIB
        shell: bash
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git

          cmake -S zlib -B zlib-build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/zlib-install"

          cmake --build zlib-build --parallel 2
          cmake --install zlib-build

          echo "Checking installed ZLIB files:"
          find zlib-install -type f

      - name: Configure project
        shell: bash
        run: |
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_ROOT="$PWD/zlib-install" \
            -DZLIB_INCLUDE_DIR="$PWD/zlib-install/include" \
            -DZLIB_LIBRARY="$PWD/zlib-install/lib/libzs.a"

      - name: Build BLADEX CLIENT
        shell: bash
        run: |
          cmake --build build --parallel 2

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: BLADEX-CLIENT-Windows
          path: build/
          if-no-files-found: error

