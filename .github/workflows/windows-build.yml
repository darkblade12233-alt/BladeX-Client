
name: BLADEX CLIENT Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          host: windows
          target: desktop
          arch: win64_mingw81
          aqtversion: '==3.2.1'

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: 8.1.0
          platform: x64

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          echo "C:\mingw64\bin" >> $env:GITHUB_PATH

      - name: Check build tools
        shell: bash
        run: |
          gcc --version
          g++ --version
          cmake --version
          java -version

      - name: Build ZLIB
        shell: bash
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git

          cmake -S zlib -B zlib-build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/zlib-install"

          cmake --build zlib-build --parallel 2
          cmake --install zlib-build

      - name: Configure BLADEX CLIENT
        shell: bash
        run: |
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_ROOT="$PWD/zlib-install" \
            -DZLIB_INCLUDE_DIR="$PWD/zlib-install/include" \
            -DZLIB_LIBRARY="$PWD/zlib-install/lib/libzs.a"

      - name: Compile BLADEX CLIENT
        shell: bash
        run: |
          cmake --build build --parallel 2

      - name: Deploy Qt and MinGW runtime
        shell: bash
        run: |
          set -e

          EXE=$(find build -type f -iname "MultiMC.exe" -print -quit)

          if [ -z "$EXE" ]; then
            echo "ERROR: MultiMC.exe not found!"
            exit 1
          fi

          EXE_DIR="$(dirname "$EXE")"
          MINGW_BIN="$(dirname "$(which g++)")"

          echo "Executable: $EXE"
          echo "MinGW folder: $MINGW_BIN"

          echo "Finding Qt installation..."

          QT_CORE=$(find "$RUNNER_WORKSPACE" -type f \
            -iname "Qt5Core.dll" -print -quit)

          if [ -z "$QT_CORE" ]; then
            echo "ERROR: Qt5Core.dll not found!"
            exit 1
          fi

          QT_BIN="$(dirname "$QT_CORE")"

          echo "Qt folder: $QT_BIN"
          echo "Copying Qt DLLs..."

          cp "$QT_BIN"/Qt5*.dll "$EXE_DIR/"

          echo "Finding Qt platform plugin..."

          QT_PLUGIN=$(find "$RUNNER_WORKSPACE" -type f \
            -path "*/plugins/platforms/qwindows.dll" -print -quit)

          if [ -z "$QT_PLUGIN" ]; then
            echo "ERROR: qwindows.dll not found!"
            exit 1
          fi

          mkdir -p "$EXE_DIR/platforms"
          cp "$QT_PLUGIN" "$EXE_DIR/platforms/qwindows.dll"

          echo "Copying MinGW runtime DLLs..."

          cp "$MINGW_BIN/libgcc_s_seh-1.dll" "$EXE_DIR/"
          cp "$MINGW_BIN/libstdc++-6.dll" "$EXE_DIR/"
          cp "$MINGW_BIN/libwinpthread-1.dll" "$EXE_DIR/"

          echo "Checking deployment..."

          ls "$EXE_DIR"
          ls "$EXE_DIR/platforms"

          echo "Deployment completed!"

      - name: Upload BLADEX CLIENT
        uses: actions/upload-artifact@v4
        with:
          name: BLADEX-CLIENT-Windows
          path: build/
          if-no-files-found: error
